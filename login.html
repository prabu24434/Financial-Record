<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Financial Record</title>
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <h1>Financial Record</h1>
      <p>Masuk ke akun kamu</p>
    </div>

    <div id="error-msg" class="error-message"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="nama@email.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" id="btn-submit" class="btn-primary">Masuk</button>
    </form>

    <div class="auth-links">
      <p><a href="./forgot-password.html">Lupa password?</a></p>
      <p style="margin-top: 8px;">Belum punya akun? <a href="./register.html">Daftar sekarang</a></p>
    </div>
  </div>

  <script type="module">
    import { loginUser } from "./js/auth.js";

    const form = document.getElementById("login-form");
    const errorMsg = document.getElementById("error-msg");
    const btnSubmit = document.getElementById("btn-submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      btnSubmit.disabled = true;
      btnSubmit.textContent = "Memproses...";

      try {
        await loginUser(email, password);
        window.location.href = "./accounts.html";
      } catch (error) {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Masuk";

        if (
          error.code === "auth/invalid-credential" || 
          error.code === "auth/user-not-found" || 
          error.code === "auth/wrong-password"
        ) {
          showError("Email atau password salah.");
        } else {
          showError("Gagal login: " + error.message);
        }
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = "block";
    }
  </script>
</body>
</html>
