<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - Financial Record</title>
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <h1>Lupa Password</h1>
      <p>Masukkan email untuk menerima instruksi reset password</p>
    </div>

    <div id="error-msg" class="error-message"></div>
    <div id="success-msg" class="success-message"></div>

    <form id="reset-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="nama@email.com">
      </div>

      <button type="submit" id="btn-submit" class="btn-primary">Kirim Email Reset</button>
    </form>

    <div class="auth-links">
      <p><a href="./login.html">Kembali ke halaman Login</a></p>
    </div>
  </div>

  <script type="module">
    import { resetPassword } from "./js/auth.js";

    const form = document.getElementById("reset-form");
    const errorMsg = document.getElementById("error-msg");
    const successMsg = document.getElementById("success-msg");
    const btnSubmit = document.getElementById("btn-submit");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";
      successMsg.style.display = "none";

      const email = document.getElementById("email").value.trim();

      btnSubmit.disabled = true;
      btnSubmit.textContent = "Mengirim...";

      try {
        await resetPassword(email);
        successMsg.textContent = "Email instruksi reset password telah dikirim. Silakan periksa kotak masuk/spam kamu.";
        successMsg.style.display = "block";
        form.reset();
      } catch (error) {
        if (error.code === "auth/user-not-found") {
          showError("Email ini tidak terdaftar.");
        } else {
          showError("Gagal mengirim email: " + error.message);
        }
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Kirim Email Reset";
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = "block";
    }
  </script>
</body>
</html>
